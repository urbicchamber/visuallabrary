<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#e9e9e5">
  <meta name="description" content="Личная коллекция визуальных референсов для Director: живопись, иллюстрации, цифровое искусство, игровые, программные и вымышленные интерфейсы.">
  <link rel="canonical" href="https://director-image-library.mattealbum8.chatgpt.site">
  <meta property="og:url" content="https://director-image-library.mattealbum8.chatgpt.site">
  <meta property="og:title" content="library">
  <title>library</title>
  <link rel="stylesheet" href="style.css?v=5">
  <script src="data.js?v=5" defer></script>
  <script src="app.js?v=5" defer></script>
</head>
<body>
  <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.3.9-4.6 4.5 1.1 6.3-5.6-3-5.6 3 1.1-6.3L3 9.6l6.2-.9Z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M3 6h3c5 0 7 12 12 12h3m-4-4 4 4-4 4M3 18h3c2 0 4-3 6-6s4-6 6-6h3m-4-4 4 4-4 4"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M14 4h6v6m0-6-8 8M10 20H4v-6m0 6 8-8"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6m0-6-9 9m-1-9H4v16h16v-6"/></symbol>
  </defs></svg>
  <header class="masthead">
    <a class="identity" href="./" aria-label="library, начало"><span class="identity-name">library</span></a>
    <div class="masthead-actions"><span id="collection-total" class="total"></span><button id="favorites-filter" class="quiet-button" aria-pressed="false"><svg class="icon"><use href="#i-star"/></svg><span>Избранное</span><span id="favorite-count">0</span></button></div>
  </header>
  <div class="browse-bar">
    <nav id="categories" class="categories" aria-label="Разделы библиотеки"></nav>
    <div class="browse-tools">
      <label class="search"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg><input id="search" type="search" placeholder="Автор, работа, метка" aria-label="Поиск по библиотеке" autocomplete="off"></label>
      <button id="shuffle" class="quiet-button shuffle-button" aria-label="Перемешать изображения"><svg class="icon"><use href="#i-shuffle"/></svg><span>Перемешать</span></button>
      <button id="density" class="density-button" aria-label="Показывать изображения крупнее" aria-pressed="false" title="Крупнее"><span></span><span></span><span></span><span></span></button>
    </div>
  </div>
  <main>
    <div class="results-line">
      <span id="results-count" aria-live="polite"></span>
      <select id="interface-type" class="interface-filter" aria-label="Тип интерфейса" hidden>
        <option value="">Все интерфейсы</option>
        <option value="Программы">Программы</option>
        <option value="Игры">Из игр</option>
        <option value="Вымышленные">Вымышленные</option>
      </select>
      <button id="reset" class="text-button" hidden>Сбросить фильтры</button>
    </div>
    <div id="gallery" class="gallery" aria-label="Изображения"></div>
    <div id="empty" class="empty" hidden><p id="empty-label">Ничего не найдено</p><button id="empty-reset" class="quiet-button">Показать всё</button></div>
  </main>
  <footer><span>Личная коллекция для просмотра и исследования</span><span>Авторы и источники — в каждой карточке</span></footer>
  <dialog id="viewer" class="viewer" aria-label="Просмотр изображения">
    <div class="viewer-top"><span id="viewer-index"></span><div class="viewer-tools"><a id="viewer-expand" class="icon-button" target="_blank" rel="noopener noreferrer" aria-label="Открыть изображение отдельно" title="Открыть изображение"><svg class="icon"><use href="#i-expand"/></svg></a><button id="viewer-close" class="icon-button" aria-label="Закрыть просмотр" autofocus><svg class="icon"><use href="#i-close"/></svg></button></div></div>
    <div class="viewer-stage"><button id="viewer-prev" class="viewer-step prev" aria-label="Предыдущее изображение"><svg class="icon"><use href="#i-arrow"/></svg></button><img id="viewer-image" src="" alt=""><button id="viewer-next" class="viewer-step next" aria-label="Следующее изображение"><svg class="icon"><use href="#i-arrow"/></svg></button></div>
    <div class="viewer-bottom"><div class="viewer-caption"><div id="viewer-author"></div><h1 id="viewer-title"></h1><div id="viewer-meta"></div><div id="viewer-tags" class="viewer-tags"></div></div><div class="viewer-actions"><button id="viewer-save" class="quiet-button" aria-pressed="false"><svg class="icon"><use href="#i-star"/></svg><span>В избранное</span></button><a id="viewer-source" class="quiet-button" target="_blank" rel="noopener noreferrer">Источник<svg class="icon"><use href="#i-external"/></svg></a></div></div>
  </dialog>
</body>
</html>

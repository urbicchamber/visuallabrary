<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#e9e9e5">
  <meta name="description" content="66 текстов об информации, памяти, искусстве и интерфейсах. Эссе, статьи и книги с цитатами и прямыми ссылками на чтение.">
  <link rel="canonical" href="https://director-image-library.mattealbum8.chatgpt.site/reading.html">
  <meta property="og:title" content="Чтение — library">
  <title>Чтение — library</title>
  <link rel="stylesheet" href="style.css?v=7">
  <script src="reading-data.js?v=1" defer></script>
  <script src="reading.js?v=1" defer></script>
</head>
<body class="reading-page">
  <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.3.9-4.6 4.5 1.1 6.3-5.6-3-5.6 3 1.1-6.3L3 9.6l6.2-.9Z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M3 6h3c5 0 7 12 12 12h3m-4-4 4 4-4 4M3 18h3c2 0 4-3 6-6s4-6 6-6h3m-4-4 4 4-4 4"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6m0-6-9 9m-1-9H4v16h16v-6"/></symbol>
  </defs></svg>
  <header class="masthead">
    <div class="masthead-library"><a class="identity" href="./" aria-label="library, начало"><span class="identity-name">library</span></a><nav class="library-tabs" aria-label="Коллекции"><a href="./">Изображения</a><a href="reading.html" aria-current="page">Чтение</a></nav></div>
    <div class="masthead-actions"><span id="collection-total" class="total"></span><button id="favorites-filter" class="quiet-button" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-star"/></svg><span>Избранное</span><span id="favorite-count">0</span></button></div>
  </header>
  <div class="browse-bar reading-browse">
    <nav id="reading-topics" class="categories" aria-label="Темы чтения"></nav>
    <div class="browse-tools">
      <label class="search"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg><input id="reading-search" type="search" placeholder="Автор, название, мысль" aria-label="Поиск по текстам" autocomplete="off"></label>
      <button id="reading-shuffle" class="quiet-button shuffle-button"><svg class="icon" aria-hidden="true"><use href="#i-shuffle"/></svg><span>Перемешать</span></button>
    </div>
  </div>
  <main>
    <div class="reading-heading"><div><p class="reading-eyebrow">Эссе · статьи · главы · книги</p><h1>Чтение</h1></div><p>Информация, память и способы видеть.</p></div>
    <div class="results-line reading-filters">
      <span id="reading-count" aria-live="polite"></span>
      <label>Язык<select id="reading-language"><option value="">Любой</option><option value="ru">Русский</option><option value="en">English</option></select></label>
      <label>Доступ<select id="reading-access"><option value="">Любой</option><option value="Полный текст">Полный текст</option><option value="Фрагмент">Фрагмент</option></select></label>
      <button id="reading-reset" class="text-button" hidden>Сбросить фильтры</button>
    </div>
    <div id="reading-grid" class="reading-grid" aria-label="Материалы для чтения"></div>
    <div id="reading-empty" class="empty" hidden><p id="reading-empty-label">Ничего не найдено</p><button id="reading-empty-reset" class="quiet-button">Показать всё</button></div>
    <noscript><p>Для просмотра подборки включите JavaScript. <a href="reading-references.json">Список материалов</a></p></noscript>
  </main>
  <footer><span>Коллекция для просмотра, чтения и исследования</span><span>Тексты открываются на сайтах авторов, изданий и библиотек</span></footer>
</body>
</html>
